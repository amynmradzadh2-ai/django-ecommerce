{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="mb-4 d-flex gap-2 flex-wrap">
        {% for category in categories %}
        <a href="{% url 'home:category' category.id %}" class="btn btn-outline-primary btn-sm">{{ category.name }}</a>
        {% endfor %}
    </div>

    <form method="get" action="{% url 'home:home' %}" class="d-flex mb-4" style="max-width: 500px;">
        <input type="text" name="q" value="{{ query }}" class="form-control me-2" placeholder="جستجوی محصول...">
        <button type="submit" class="btn btn-primary">جستجو</button>
    </form>

    <div class="row">
        {% for product in products %}
        <div class="col-md-3 mb-4">
            <div class="card h-100">
                <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">
                        <a href="{% url 'home:product' product.id product.slug %}">{{ product.name }}</a>
                    </h5>
                    <p class="card-text small flex-grow-1">{{ product.discription|truncatewords:15 }}</p>
                    <p class="card-text"><strong>{{ product.price }} تومان</strong></p>
                    <form method="post" action="{% url 'cart:cart_add' product.id %}">
                        {% csrf_token %}
                        <button type="submit" class="btn-add-cart" style="border:none; width:100%;">افزودن به سبد</button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
